<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Spanda logo">
  <defs>
    <linearGradient id="spanda-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="0.55" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="spanda-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- sync spokes: devices connected to the one pulse -->
  <g stroke="url(#spanda-grad)" stroke-width="2" opacity="0.14">
    <line x1="120" y1="120" x2="216" y2="120"/>
    <line x1="120" y1="120" x2="168" y2="203.1"/>
    <line x1="120" y1="120" x2="72"  y2="203.1"/>
    <line x1="120" y1="120" x2="24"  y2="120"/>
    <line x1="120" y1="120" x2="72"  y2="36.9"/>
    <line x1="120" y1="120" x2="168" y2="36.9"/>
  </g>

  <!-- pulse rings: the shared sound field -->
  <g fill="none" stroke="url(#spanda-grad)" stroke-linecap="round">
    <circle cx="120" cy="120" r="28" stroke-width="7" opacity="0.95"/>
    <circle cx="120" cy="120" r="50" stroke-width="6" opacity="0.62"/>
    <circle cx="120" cy="120" r="72" stroke-width="5" opacity="0.34"/>
  </g>

  <!-- device nodes on the orbit -->
  <g fill="url(#spanda-grad)">
    <circle cx="216"   cy="120"   r="7.5"/>
    <circle cx="168"   cy="203.1" r="7.5"/>
    <circle cx="72"    cy="203.1" r="7.5"/>
    <circle cx="24"    cy="120"   r="7.5"/>
    <circle cx="72"    cy="36.9"  r="7.5"/>
    <circle cx="168"   cy="36.9"  r="7.5"/>
  </g>

  <!-- the central pulse -->
  <circle cx="120" cy="120" r="12" fill="url(#spanda-grad)" filter="url(#spanda-glow)"/>
</svg>
