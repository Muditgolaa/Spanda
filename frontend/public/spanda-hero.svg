<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Spanda animated logo">
  <defs>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="0.55" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="sgl" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- outward-travelling pulse ring (spanda = vibration) -->
  <circle cx="120" cy="120" r="20" fill="none" stroke="url(#sg)" stroke-width="5">
    <animate attributeName="r" values="20;96" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="6;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- static field rings -->
  <g fill="none" stroke="url(#sg)" stroke-linecap="round">
    <circle cx="120" cy="120" r="28" stroke-width="7" opacity="0.95"/>
    <circle cx="120" cy="120" r="50" stroke-width="6" opacity="0.55"/>
    <circle cx="120" cy="120" r="72" stroke-width="5" opacity="0.28"/>
  </g>

  <!-- device nodes -->
  <g fill="url(#sg)">
    <circle cx="216" cy="120" r="7.5"/>
    <circle cx="168" cy="203.1" r="7.5"/>
    <circle cx="72" cy="203.1" r="7.5"/>
    <circle cx="24" cy="120" r="7.5"/>
    <circle cx="72" cy="36.9" r="7.5"/>
    <circle cx="168" cy="36.9" r="7.5"/>
  </g>

  <!-- central pulse: gentle breathe -->
  <circle cx="120" cy="120" r="12" fill="url(#sg)" filter="url(#sgl)">
    <animate attributeName="r" values="11;13.5;11" dur="2.6s" repeatCount="indefinite"/>
  </circle>
</svg>
