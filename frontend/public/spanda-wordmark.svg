<svg viewBox="0 0 760 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Spanda">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="0.55" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="lgl" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- mark -->
  <g transform="translate(0,0) scale(1)">
    <g stroke="url(#lg)" stroke-width="2" opacity="0.14">
      <line x1="120" y1="120" x2="216" y2="120"/>
      <line x1="120" y1="120" x2="168" y2="203.1"/>
      <line x1="120" y1="120" x2="72" y2="203.1"/>
      <line x1="120" y1="120" x2="24" y2="120"/>
      <line x1="120" y1="120" x2="72" y2="36.9"/>
      <line x1="120" y1="120" x2="168" y2="36.9"/>
    </g>
    <g fill="none" stroke="url(#lg)" stroke-linecap="round">
      <circle cx="120" cy="120" r="28" stroke-width="7" opacity="0.95"/>
      <circle cx="120" cy="120" r="50" stroke-width="6" opacity="0.62"/>
      <circle cx="120" cy="120" r="72" stroke-width="5" opacity="0.34"/>
    </g>
    <g fill="url(#lg)">
      <circle cx="216" cy="120" r="7.5"/>
      <circle cx="168" cy="203.1" r="7.5"/>
      <circle cx="72" cy="203.1" r="7.5"/>
      <circle cx="24" cy="120" r="7.5"/>
      <circle cx="72" cy="36.9" r="7.5"/>
      <circle cx="168" cy="36.9" r="7.5"/>
    </g>
    <circle cx="120" cy="120" r="12" fill="url(#lg)" filter="url(#lgl)"/>
  </g>

  <!-- wordmark -->
  <text x="270" y="132" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="96" letter-spacing="-2" fill="url(#lg)">Spanda</text>
  <text x="272" y="172" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="24" fill="#9ca3af">स्पन्द · many devices, one sound field</text>
</svg>
